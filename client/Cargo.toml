[package]
name = "tasked-client"
description = "Rust HTTP client for the Tasked server API"
version = "0.0.1"
edition = "2024"
license = "MIT"

[dependencies]
tasked = { path = "..", default-features = false }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.13", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt"] }
futures = "0.3"

